<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CadastroUepa</title>
    <link rel="icon" type="image/png" href="png">
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>

    <div class="container">

        <form class="formulario">

            <h1>Cadastro</h1>

            <h2>Dados Pessoais</h2>

            <label>Nome</label>
            <input type="text">

            <label>CPF</label>
            <input type="text">

            <label>Data de Nascimento</label>
            <input type="date">

            <label>Sexo</label>
            <select>
                <option>Selecione</option>
                <option>Masculino</option>
                <option>Feminino</option>
            </select>

            <label>Telefone</label>
            <input type="text">

            <label>E-mail</label>
            <input type="email">

            <div class="check">
                <input type="checkbox">
                <span>Este e-mail é usado para contato</span>
            </div>

            <h2>Endereço</h2>

            <label>Endereço</label>
            <input type="text">

            <label>Cidade</label>
            <input type="text">

            <label>Estado</label>
            <input type="text">

            <button type="submit">Cadastrar</button>

        </form>

    </div>

</body>
</html>
